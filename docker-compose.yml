services:
  postgres:
    image: postgres:16-alpine
    container_name: validation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-residence_validation}
      POSTGRES_USER: ${POSTGRES_USER:-validator_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-validator_secret_pwd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - validation-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-validator_user} -d $${POSTGRES_DB:-residence_validation}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: validation-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKEND_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-residence_validation}
      POSTGRES_USER: ${POSTGRES_USER:-validator_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-validator_secret_pwd}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-4-hydrogen}
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1/interactions}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-45}
      TESSERACT_DATAPATH: ${TESSERACT_DATAPATH:-/usr/share/tessdata}
      TESSERACT_LANGUAGE: ${TESSERACT_LANGUAGE:-por+eng}
      TESSDATA_PREFIX: /usr/share/tessdata
      VALIDATION_MAX_DOCUMENT_AGE_DAYS: ${VALIDATION_MAX_DOCUMENT_AGE_DAYS:-90}
      VALIDATION_MIN_OCR_CHARS: ${VALIDATION_MIN_OCR_CHARS:-25}
      VALIDATION_NAME_SIMILARITY_THRESHOLD: ${VALIDATION_NAME_SIMILARITY_THRESHOLD:-0.60}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      UPLOAD_STORAGE_DIR: /app/storage/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/storage/uploads
    networks:
      - validation-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: validation-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - validation-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  uploads_data:

networks:
  validation-net:
    driver: bridge
