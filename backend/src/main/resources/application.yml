server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: residence-validation-backend
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_UPLOAD_SIZE_MB:10}MB
      max-request-size: 12MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:residence_validation}
    username: ${POSTGRES_USER:validator_user}
    password: ${POSTGRES_PASSWORD:validator_secret_pwd}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  storage:
    upload-dir: ${UPLOAD_STORAGE_DIR:/tmp/residence-validation-uploads}
    max-file-size-bytes: 10485760
  ocr:
    datapath: ${TESSERACT_DATAPATH:/usr/share/tesseract-ocr/5/tessdata}
    language: ${TESSERACT_LANGUAGE:por+eng}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-4-hydrogen}
      api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1/interactions}
      timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:45}
      fallback-heuristic-enabled: ${GEMINI_FALLBACK_HEURISTIC_ENABLED:true}
  validation:
    max-document-age-days: ${VALIDATION_MAX_DOCUMENT_AGE_DAYS:90}
    min-ocr-chars: ${VALIDATION_MIN_OCR_CHARS:25}
    name-similarity-threshold: ${VALIDATION_NAME_SIMILARITY_THRESHOLD:0.60}
